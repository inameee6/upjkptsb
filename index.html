<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senarai Dokumentasi Kualiti — UPJK PTSB</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0e0e0e;
    --red: #c41e1e;
    --red-dark: #8b1414;
    --white: #fafaf8;
    --gray-1: #f4f3f0;
    --gray-2: #e8e6e1;
    --gray-3: #9e9c96;
    --gray-4: #5c5a55;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--white); color: var(--black); }

  .search-wrap { padding: 1rem 1.5rem; background: var(--gray-1); border-bottom: 1px solid var(--gray-2); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .search-box { flex: 1; max-width: 380px; display: flex; align-items: center; gap: 10px; background: var(--white); border: 1px solid var(--gray-2); padding: 0 14px; height: 38px; border-radius: 2px; }
  .search-box input { border: none; outline: none; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--black); background: transparent; flex: 1; }
  .search-box input::placeholder { color: var(--gray-3); }
  .filter-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab { padding: 6px 14px; font-size: 12px; font-weight: 500; border: 1px solid var(--gray-2); background: var(--white); color: var(--gray-4); cursor: pointer; border-radius: 2px; transition: all 0.15s; }
  .tab:hover { background: var(--gray-2); }
  .tab.active { background: var(--black); color: var(--white); border-color: var(--black); }

  .layout { display: grid; grid-template-columns: 220px 1fr; min-height: 500px; }

  .sidebar { border-right: 1px solid var(--gray-2); padding: 1.5rem 0; background: var(--white); }
  .sidebar-heading { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gray-3); padding: 0 1.25rem; margin-bottom: 8px; font-weight: 500; }
  .sidebar-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 1.25rem; font-size: 13px; color: var(--gray-4); cursor: pointer; border-left: 2px solid transparent; transition: all 0.15s; }
  .sidebar-item:hover { color: var(--black); background: var(--gray-1); }
  .sidebar-item.active { color: var(--black); font-weight: 500; border-left-color: var(--red); background: var(--gray-1); }
  .sidebar-count { font-size: 11px; color: var(--gray-3); background: var(--gray-1); padding: 1px 7px; border-radius: 10px; }

  .content { padding: 1.5rem 2rem; }
  .content-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.25rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--gray-2); }
  .content-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 500; color: var(--black); }
  .content-count { font-size: 12px; color: var(--gray-3); }

  .doc-table { width: 100%; border-collapse: collapse; }
  .doc-table th { text-align: left; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gray-3); font-weight: 500; padding: 0 12px 10px; border-bottom: 1px solid var(--gray-2); }
  .doc-table th:first-child { padding-left: 0; }
  .doc-row { border-bottom: 1px solid var(--gray-2); cursor: pointer; transition: background 0.12s; animation: fadeUp 0.3s ease both; }
  .doc-row:hover { background: var(--gray-1); }
  .doc-row:last-child { border-bottom: none; }
  .doc-row td { padding: 12px; vertical-align: middle; }
  .doc-row td:first-child { padding-left: 0; }
  .doc-cell-main { display: flex; align-items: center; gap: 12px; }
  .doc-icon { width: 34px; height: 34px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; flex-shrink: 0; }
  .icon-pdf { background: #fef2f2; color: var(--red); border: 1px solid #fecaca; }
  .icon-doc { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
  .icon-xls { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
  .icon-default { background: var(--gray-1); color: var(--gray-4); border: 1px solid var(--gray-2); }
  .doc-name { font-size: 13px; font-weight: 500; color: var(--black); line-height: 1.3; }
  .doc-code { font-size: 11px; color: var(--gray-3); margin-top: 2px; letter-spacing: 0.03em; }
  .doc-category { font-size: 11px; color: var(--gray-4); }
  .doc-date { font-size: 12px; color: var(--gray-3); }
  .doc-version { font-size: 11px; color: var(--gray-4); background: var(--gray-1); border: 1px solid var(--gray-2); padding: 2px 8px; border-radius: 2px; font-family: monospace; }
  .doc-actions { display: flex; gap: 6px; opacity: 0; transition: opacity 0.15s; }
  .doc-row:hover .doc-actions { opacity: 1; }
  .btn-action { display: flex; align-items: center; gap: 4px; padding: 5px 10px; font-size: 11px; font-weight: 500; border-radius: 2px; cursor: pointer; border: 1px solid var(--gray-2); background: var(--white); color: var(--gray-4); transition: all 0.12s; font-family: 'DM Sans', sans-serif; text-decoration: none; }
  .btn-action:hover { background: var(--black); color: var(--white); border-color: var(--black); }
  .btn-action.primary { background: var(--red); color: var(--white); border-color: var(--red); }
  .btn-action.primary:hover { background: var(--red-dark); }

  .state-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3rem 2rem; gap: 10px; }
  .state-title { font-size: 14px; font-weight: 500; color: var(--gray-4); }
  .state-sub { font-size: 12px; color: var(--gray-3); text-align: center; }
  .spinner { width: 24px; height: 24px; border: 2px solid var(--gray-2); border-top-color: var(--red); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .refresh-btn { display: flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 12px; border: 1px solid var(--gray-2); background: var(--white); color: var(--gray-4); border-radius: 2px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .refresh-btn:hover { background: var(--black); color: var(--white); border-color: var(--black); }

  .stats-bar { display: flex; gap: 2rem; padding: 0.75rem 1.5rem; background: var(--black); }
  .stat-item { display: flex; align-items: center; gap: 8px; }
  .stat-num { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; color: var(--white); }
  .stat-label { font-size: 11px; color: var(--gray-3); letter-spacing: 0.04em; }
  .stat-divider { width: 1px; height: 24px; background: #2a2a2a; }
</style>
</head>
<body>

<!-- Stats bar ringkas -->
<div class="stats-bar">
  <div class="stat-item">
    <div class="stat-num" id="stat-total">—</div>
    <div class="stat-label">Jumlah Dokumen</div>
  </div>
  <div class="stat-divider"></div>
  <div class="stat-item">
    <div class="stat-num" id="stat-cat">—</div>
    <div class="stat-label">Kategori</div>
  </div>
  <div class="stat-divider"></div>
  <div class="stat-item">
    <div class="stat-num">2026</div>
    <div class="stat-label">Versi Semasa</div>
  </div>
</div>

<!-- Search -->
<div class="search-wrap">
  <div class="search-box">
    <svg viewBox="0 0 20 20" fill="currentColor" width="15" height="15" style="color:#9e9c96;flex-shrink:0;"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
    <input type="text" id="searchInput" placeholder="Cari dokumen, kod, atau kategori..." oninput="applyFilters()">
  </div>
  <div class="filter-tabs" id="filterTabs">
    <div class="tab active" onclick="setTabFilter('', this)">Semua</div>
  </div>
  <button class="refresh-btn" onclick="loadData()">
    <svg viewBox="0 0 20 20" fill="currentColor" width="13" height="13"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/></svg>
    Muat Semula
  </button>
</div>

<!-- Layout -->
<div class="layout">
  <div class="sidebar">
    <div style="margin-bottom:1.5rem;">
      <div class="sidebar-heading">Kategori Dokumen</div>
      <div class="sidebar-item active" onclick="setSidebarFilter('', this)">
        Semua Dokumen <span class="sidebar-count" id="count-all">—</span>
      </div>
      <div id="sidebarCats"></div>
    </div>
  </div>

  <div class="content">
    <div class="content-header">
      <div class="content-title" id="content-title">Semua Dokumen</div>
      <div class="content-count" id="content-count">Memuatkan...</div>
    </div>
    <div id="tableWrap">
      <div class="state-box">
        <div class="spinner"></div>
        <div class="state-title">Memuatkan dokumen...</div>
        <div class="state-sub">Mengambil data dari Google Sheets</div>
      </div>
    </div>
  </div>
</div>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQmn51v8yGSoUKDIDXy1_2BzhXlGX1MhhA1l2QYy4lcA7vYY4RLgWLog2ylr0WTzSHlge5IalHRdTDD/pub?output=csv";

let allDocs = [], activeFilter = '', activeSidebar = '', searchQ = '';

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().replace(/"/g,'').toLowerCase());
  return lines.slice(1).map(line => {
    const vals = []; let cur = '', inQ = false;
    for (let c of line) {
      if (c==='"') { inQ=!inQ; } else if (c===','&&!inQ) { vals.push(cur.trim()); cur=''; } else { cur+=c; }
    }
    vals.push(cur.trim());
    const obj = {};
    headers.forEach((h,i) => obj[h]=(vals[i]||'').replace(/"/g,'').trim());
    return obj;
  }).filter(d => d.nama||d.kod);
}

function getIconClass(nama) {
  const n=(nama||'').toLowerCase();
  if(n.includes('pdf')) return 'icon-pdf';
  if(n.includes('xls')||n.includes('excel')) return 'icon-xls';
  if(n.includes('doc')||n.includes('word')) return 'icon-doc';
  return 'icon-default';
}
function getIconLabel(nama) {
  const n=(nama||'').toLowerCase();
  if(n.includes('pdf')) return 'PDF';
  if(n.includes('xls')) return 'XLS';
  if(n.includes('doc')) return 'DOC';
  return 'FAIL';
}

function buildSidebar(docs) {
  const cats={};
  docs.forEach(d => { const c=d.kategori||'Lain-lain'; cats[c]=(cats[c]||0)+1; });
  document.getElementById('count-all').textContent=docs.length;
  document.getElementById('stat-total').textContent=docs.length;
  document.getElementById('stat-cat').textContent=Object.keys(cats).length;
  const tabs=document.getElementById('filterTabs');
  const sidebar=document.getElementById('sidebarCats');
  tabs.innerHTML=`<div class="tab active" onclick="setTabFilter('',this)">Semua</div>`;
  sidebar.innerHTML='';
  Object.entries(cats).forEach(([cat,count]) => {
    tabs.innerHTML+=`<div class="tab" onclick="setTabFilter('${cat}',this)">${cat}</div>`;
    sidebar.innerHTML+=`<div class="sidebar-item" onclick="setSidebarFilter('${cat}',this)">${cat}<span class="sidebar-count">${count}</span></div>`;
  });
}

function renderTable(docs) {
  const wrap=document.getElementById('tableWrap');
  document.getElementById('content-count').textContent=docs.length+' dokumen';
  if(docs.length===0) {
    wrap.innerHTML=`<div class="state-box"><div style="font-size:28px;">📂</div><div class="state-title">Tiada dokumen dijumpai</div><div class="state-sub">Cuba ubah carian atau pilih kategori lain</div></div>`;
    return;
  }
  wrap.innerHTML=`<table class="doc-table"><thead><tr><th style="width:42%">Nama Dokumen</th><th style="width:16%">Kategori</th><th style="width:14%">Tarikh</th><th style="width:10%">Versi</th><th style="width:18%"></th></tr></thead><tbody>${
    docs.map((d,i)=>`<tr class="doc-row" style="animation-delay:${i*0.04}s"><td><div class="doc-cell-main"><div class="doc-icon ${getIconClass(d.nama)}">${getIconLabel(d.nama)}</div><div><div class="doc-name">${d.nama||'—'}</div><div class="doc-code">${d.kod||''}</div></div></div></td><td><div class="doc-category">${d.kategori||'—'}</div></td><td><div class="doc-date">${d.tarikh||'—'}</div></td><td><div class="doc-version">${d.versi||'—'}</div></td><td><div class="doc-actions">${d.link?`<a href="${d.link}" target="_blank" class="btn-action primary">Muat Turun</a><a href="${d.link}" target="_blank" class="btn-action">Lihat</a>`:`<span style="font-size:11px;color:var(--gray-3)">Tiada pautan</span>`}</div></td></tr>`).join('')
  }</tbody></table>`;
}

function applyFilters() {
  searchQ=document.getElementById('searchInput').value.toLowerCase();
  const filtered=allDocs.filter(d => {
    const matchCat=!activeSidebar||(d.kategori||')===activeSidebar;
    const matchSearch=!searchQ||(d.nama||'').toLowerCase().includes(searchQ)||(d.kod||'').toLowerCase().includes(searchQ)||(d.kategori||'').toLowerCase().includes(searchQ);
    return matchCat&&matchSearch;
  });
  renderTable(filtered);
}

function setTabFilter(cat,el) {
  activeFilter=cat; activeSidebar=cat;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active');
  document.querySelectorAll('.sidebar-item').forEach(i=>i.classList.remove('active'));
  if(!cat) document.querySelector('.sidebar-item').classList.add('active');
  document.getElementById('content-title').textContent=cat||'Semua Dokumen';
  applyFilters();
}

function setSidebarFilter(cat,el) {
  activeSidebar=cat; activeFilter=cat;
  document.querySelectorAll('.sidebar-item').forEach(i=>i.classList.remove('active')); el.classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('content-title').textContent=cat||'Semua Dokumen';
  applyFilters();
}

async function loadData() {
  document.getElementById('tableWrap').innerHTML=`<div class="state-box"><div class="spinner"></div><div class="state-title">Memuatkan dokumen...</div></div>`;
  try {
    const res=await fetch(SHEET_URL);
    if(!res.ok) throw new Error('Gagal');
    const text=await res.text();
    allDocs=parseCSV(text);
    buildSidebar(allDocs);
    applyFilters();
  } catch(e) {
    document.getElementById('tableWrap').innerHTML=`<div class="state-box"><div style="font-size:28px;">⚠️</div><div class="state-title">Gagal memuatkan data</div><div class="state-sub">Pastikan Google Sheets dah di-publish.<br>Klik "Muat Semula" untuk cuba lagi.</div></div>`;
    document.getElementById('content-count').textContent='Ralat';
  }
}

loadData();
</script>
</body>
</html>
