<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senarai Dokumentasi Kualiti — UPJK PTSB</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0e0e0e; --red: #c41e1e; --red-dark: #8b1414;
    --white: #ffffff; --gray-1: #f7f7f7; --gray-2: #e8e6e1;
    --gray-3: #9e9c96; --gray-4: #5c5a55;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; background: #ffffff; }
  body { font-family: 'DM Sans', sans-serif; color: var(--black); font-size: 17px; }

  .stats-bar { display: flex; gap: 2.5rem; padding: 1.1rem 2rem; background: var(--black); width: 100%; }
  .stat-num { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 600; color: var(--white); }
  .stat-label { font-size: 12px; color: var(--gray-3); letter-spacing: 0.04em; margin-top: 2px; }
  .stat-divider { width: 1px; height: 32px; background: #2a2a2a; align-self: center; }

  .search-wrap { padding: 1.1rem 2rem; background: var(--gray-1); border-bottom: 1px solid var(--gray-2); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; width: 100%; }
  .search-box { flex: 1; max-width: 460px; display: flex; align-items: center; gap: 10px; background: var(--white); border: 1px solid var(--gray-2); padding: 0 16px; height: 46px; border-radius: 3px; }
  .search-box input { border: none; outline: none; font-family: 'DM Sans', sans-serif; font-size: 16px; color: var(--black); background: transparent; flex: 1; }
  .search-box input::placeholder { color: var(--gray-3); }
  .filter-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab { padding: 9px 18px; font-size: 14px; font-weight: 500; border: 1px solid var(--gray-2); background: var(--white); color: var(--gray-4); cursor: pointer; border-radius: 3px; transition: all 0.15s; }
  .tab:hover { background: var(--gray-2); }
  .tab.active { background: var(--black); color: var(--white); border-color: var(--black); }
  .refresh-btn { display: flex; align-items: center; gap: 6px; padding: 9px 18px; font-size: 14px; font-weight: 500; border: 1px solid var(--gray-2); background: var(--white); color: var(--gray-4); border-radius: 3px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .refresh-btn:hover { background: var(--black); color: var(--white); border-color: var(--black); }
  .cache-badge { font-size: 12px; color: var(--gray-3); }
  .cache-badge.fresh { color: #166534; }

  .layout { display: grid; grid-template-columns: 260px 1fr; min-height: 500px; width: 100%; background: #ffffff; }

  /* Sidebar — bold dan jelas */
  .sidebar { border-right: 1px solid var(--gray-2); border-top: 4px solid var(--red); padding: 2rem 0; background: #ffffff; }
  .sidebar-heading { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gray-3); padding: 0 1.5rem; margin-bottom: 10px; font-weight: 500; }
  .sidebar-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 1.5rem; font-size: 15px; font-weight: 600; color: var(--black); cursor: pointer; border-left: 3px solid transparent; transition: all 0.15s; }
  .sidebar-item:hover { color: var(--red); background: var(--gray-1); }
  .sidebar-item.active { color: var(--red); font-weight: 700; border-left-color: var(--red); background: var(--gray-1); }
  .sidebar-count { font-size: 12px; color: var(--gray-3); background: var(--gray-2); padding: 2px 9px; border-radius: 10px; font-weight: 400; }

  .content { padding: 2rem 2.5rem; background: #ffffff; }
  .content-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--gray-2); }
  .content-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 500; color: var(--black); }
  .content-count { font-size: 14px; color: var(--gray-3); }

  .doc-table { width: 100%; border-collapse: collapse; background: #ffffff; }
  .doc-table th { text-align: left; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gray-3); font-weight: 500; padding: 0 14px 14px; border-bottom: 1px solid var(--gray-2); }
  .doc-table th:first-child { padding-left: 0; }
  .doc-row { border-bottom: 1px solid var(--gray-2); transition: background 0.12s; animation: fadeUp 0.25s ease both; }
  .doc-row:hover { background: var(--gray-1); }
  .doc-row:last-child { border-bottom: none; }
  .doc-row td { padding: 16px 14px; vertical-align: middle; }
  .doc-row td:first-child { padding-left: 0; }
  .doc-cell-main { display: flex; align-items: center; gap: 14px; }
  .doc-icon { width: 42px; height: 42px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .icon-pdf { background: #e8f0fb; color: #1a4f8a; border: 1px solid #b8d0f0; }
  .icon-doc { background: #e8f0fb; color: #1a4f8a; border: 1px solid #b8d0f0; }
  .icon-xls { background: #e8f0fb; color: #1a4f8a; border: 1px solid #b8d0f0; }
  .icon-default { background: #e8f0fb; color: #1a4f8a; border: 1px solid #b8d0f0; }
  .doc-name { font-size: 15px; font-weight: 500; color: var(--black); line-height: 1.4; }
  .doc-code { font-size: 13px; color: var(--gray-3); margin-top: 3px; }
  .doc-category { font-size: 14px; color: var(--gray-4); }
  .doc-date { font-size: 14px; color: var(--gray-3); }
  .doc-version { font-size: 13px; color: var(--gray-4); background: var(--gray-1); border: 1px solid var(--gray-2); padding: 4px 10px; border-radius: 3px; font-family: monospace; }
  .doc-actions { display: flex; gap: 8px; }
  .btn-action { display: flex; align-items: center; gap: 5px; padding: 7px 14px; font-size: 13px; font-weight: 500; border-radius: 3px; cursor: pointer; border: 1px solid var(--gray-2); background: var(--white); color: var(--gray-4); transition: all 0.12s; font-family: 'DM Sans', sans-serif; text-decoration: none; }
  .btn-action:hover { background: var(--black); color: var(--white); border-color: var(--black); }
  .btn-action.primary { background: var(--red); color: var(--white); border-color: var(--red); }
  .btn-action.primary:hover { background: var(--red-dark); }

  .skeleton { background: linear-gradient(90deg, var(--gray-2) 25%, var(--gray-1) 50%, var(--gray-2) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 3px; }
  .sk-icon { width: 42px; height: 42px; border-radius: 4px; flex-shrink: 0; }
  .sk-text { height: 15px; border-radius: 2px; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .state-box { display: flex; flex-direction: column; align-items: center; padding: 3rem 2rem; gap: 12px; }
  .state-title { font-size: 16px; font-weight: 500; color: var(--gray-4); }
  .state-sub { font-size: 14px; color: var(--gray-3); text-align: center; }
  .sk-sidebar { padding: 12px 1.5rem; display: flex; justify-content: space-between; }
</style>
</head>
<body>

<div class="stats-bar" style="justify-content:space-between;align-items:center;">
  <div>
    <div class="stat-num" id="stat-total">—</div>
    <div class="stat-label">Jumlah Dokumen</div>
  </div>
  <div class="stat-divider"></div>
  <div>
    <div class="stat-num" id="stat-cat">—</div>
    <div class="stat-label">Kategori</div>
  </div>
  <div class="stat-divider"></div>
  <div>
    <div class="stat-num">2026</div>
    <div class="stat-label">Versi Semasa</div>
  </div>
  <a href="https://inameee6.github.io/login-page-upjk/portal-v2.html" style="display:flex;align-items:center;gap:8px;padding:8px 18px;background:transparent;border:1px solid rgba(255,255,255,0.25);border-radius:3px;color:rgba(255,255,255,0.85);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;text-decoration:none;letter-spacing:0.03em;transition:all 0.15s;" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='transparent'">
    <svg viewBox="0 0 20 20" fill="currentColor" width="15" height="15"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/></svg>
    Kembali ke Portal
  </a>
</div>

<div class="search-wrap">
  <div class="search-box">
    <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18" style="color:#9e9c96;flex-shrink:0;"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
    <input type="text" id="searchInput" placeholder="Cari dokumen, kod, atau kategori..." oninput="applyFilters()">
  </div>
  <div class="filter-tabs" id="filterTabs">
    <div class="tab active" onclick="setTabFilter('',this)">Semua</div>
  </div>
  <button class="refresh-btn" onclick="forceRefresh()">
    <svg viewBox="0 0 20 20" fill="currentColor" width="15" height="15"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/></svg>
    Refresh
  </button>
  <span class="cache-badge" id="cacheBadge"></span>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-heading">Kategori Dokumen</div>
    <div class="sidebar-item active" onclick="setSidebarFilter('',this)">
      Semua Dokumen <span class="sidebar-count" id="count-all">—</span>
    </div>
    <div id="sidebarCats">
      <div class="sk-sidebar"><div class="skeleton sk-text" style="width:65%;"></div><div class="skeleton sk-text" style="width:28px;"></div></div>
      <div class="sk-sidebar"><div class="skeleton sk-text" style="width:50%;"></div><div class="skeleton sk-text" style="width:28px;"></div></div>
      <div class="sk-sidebar"><div class="skeleton sk-text" style="width:70%;"></div><div class="skeleton sk-text" style="width:28px;"></div></div>
    </div>
  </div>

  <div class="content">
    <div class="content-header">
      <div class="content-title" id="content-title">Semua Dokumen</div>
      <div class="content-count" id="content-count">Memuatkan...</div>
    </div>
    <div id="tableWrap">
      <table class="doc-table">
        <thead><tr>
          <th style="width:38%">Nama Dokumen</th>
          <th style="width:14%">Kategori</th>
          <th style="width:14%">Tarikh Kuatkuasa</th>
          <th style="width:8%">Versi</th>
          <th style="width:26%">Tindakan</th>
        </tr></thead>
        <tbody>${[1,2,3,4,5].map(()=>`<tr>
          <td><div style="display:flex;align-items:center;gap:14px;">
            <div class="skeleton sk-icon"></div>
            <div style="flex:1;">
              <div class="skeleton sk-text" style="width:72%;margin-bottom:8px;"></div>
              <div class="skeleton sk-text" style="width:32%;height:12px;"></div>
            </div>
          </div></td>
          <td><div class="skeleton sk-text" style="width:80px;"></div></td>
          <td><div class="skeleton sk-text" style="width:90px;"></div></td>
          <td><div class="skeleton sk-text" style="width:42px;"></div></td>
          <td><div class="skeleton sk-text" style="width:120px;height:34px;border-radius:3px;"></div></td>
        </tr>`).join('')}</tbody>
      </table>
    </div>
  </div>
</div>

<script>
const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQmn51v8yGSoUKDIDXy1_2BzhXlGX1MhhA1l2QYy4lcA7vYY4RLgWLog2ylr0WTzSHlge5IalHRdTDD/pub?output=csv";
const CACHE_KEY="upjk_docs_cache", CACHE_TIME_KEY="upjk_docs_time", CACHE_DURATION=30*60*1000;
let allDocs=[], activeFilter='', activeSidebar='', searchQ='';

function parseCSV(text){
  const lines=text.trim().split('\n');
  if(lines.length<2) return [];
  const headers=lines[0].split(',').map(h=>h.trim().replace(/"/g,'').toLowerCase());
  return lines.slice(1).map(line=>{
    const vals=[];let cur='',inQ=false;
    for(let c of line){if(c==='"'){inQ=!inQ;}else if(c===','&&!inQ){vals.push(cur.trim());cur='';}else{cur+=c;}}
    vals.push(cur.trim());
    const obj={};
    headers.forEach((h,i)=>obj[h]=(vals[i]||'').replace(/"/g,'').trim());
    return obj;
  }).filter(d=>d.nama||d.kod);
}

function getIconClass(n){n=(n||'').toLowerCase();if(n.includes('pdf'))return 'icon-pdf';if(n.includes('xls'))return 'icon-xls';if(n.includes('doc'))return 'icon-doc';return 'icon-default';}
function getIconEl(n){n=(n||'').toLowerCase();if(n.includes('pdf'))return '<i class="ti ti-file-type-pdf"></i>';if(n.includes('xls'))return '<i class="ti ti-file-spreadsheet"></i>';if(n.includes('doc'))return '<i class="ti ti-file-type-doc"></i>';return '<i class="ti ti-file"></i>';}

function getTarikh(d){
  return d['tarikh kuatkuasa'] || d['tarikh'] || '—';
}

function buildSidebar(docs){
  const cats={};
  docs.forEach(d=>{const c=d.kategori||'Lain-lain';cats[c]=(cats[c]||0)+1;});
  document.getElementById('count-all').textContent=docs.length;
  document.getElementById('stat-total').textContent=docs.length;
  document.getElementById('stat-cat').textContent=Object.keys(cats).length;
  const tabs=document.getElementById('filterTabs');
  const sidebar=document.getElementById('sidebarCats');
  tabs.innerHTML=`<div class="tab active" onclick="setTabFilter('',this)">Semua</div>`;
  sidebar.innerHTML='';
  Object.entries(cats).forEach(([cat,count])=>{
    tabs.innerHTML+=`<div class="tab" onclick="setTabFilter('${cat}',this)">${cat}</div>`;
    sidebar.innerHTML+=`<div class="sidebar-item" onclick="setSidebarFilter('${cat}',this)">${cat}<span class="sidebar-count">${count}</span></div>`;
  });
}

function renderTable(docs){
  const wrap=document.getElementById('tableWrap');
  document.getElementById('content-count').textContent=docs.length+' dokumen';
  if(docs.length===0){
    wrap.innerHTML=`<div class="state-box"><div style="font-size:36px;">📂</div><div class="state-title">Tiada dokumen dijumpai</div><div class="state-sub">Cuba ubah carian atau pilih kategori lain</div></div>`;
    return;
  }
  wrap.innerHTML=`<table class="doc-table"><thead><tr>
    <th style="width:38%">Nama Dokumen</th>
    <th style="width:14%">Kategori</th>
    <th style="width:14%">Tarikh Kuatkuasa</th>
    <th style="width:8%">Versi</th>
    <th style="width:26%">Tindakan</th>
  </tr></thead><tbody>${docs.map((d,i)=>`
    <tr class="doc-row" style="animation-delay:${i*0.03}s">
      <td><div class="doc-cell-main">
        <div class="doc-icon ${getIconClass(d.nama)}">${getIconEl(d.nama)}</div>
        <div><div class="doc-name">${d.nama||'—'}</div><div class="doc-code">${d.kod||''}</div></div>
      </div></td>
      <td><div class="doc-category">${d.kategori||'—'}</div></td>
      <td><div class="doc-date">${getTarikh(d)}</div></td>
      <td><div class="doc-version">${d.versi||'—'}</div></td>
      <td><div class="doc-actions">${d.link
        ?`<a href="${d.link}" target="_blank" class="btn-action primary">⬇ Muat Turun</a><a href="${d.link}" target="_blank" class="btn-action">👁 Lihat</a>`
        :`<span style="font-size:13px;color:var(--gray-3)">Tiada pautan</span>`
      }</div></td>
    </tr>`).join('')}</tbody></table>`;
}

function applyFilters(){
  searchQ=document.getElementById('searchInput').value.toLowerCase();
  const filtered=allDocs.filter(d=>{
    const matchCat=!activeSidebar||(d.kategori||'')===activeSidebar;
    const matchSearch=!searchQ||
      (d.nama||'').toLowerCase().includes(searchQ)||
      (d.kod||'').toLowerCase().includes(searchQ)||
      (d.kategori||'').toLowerCase().includes(searchQ)||
      (getTarikh(d)).toLowerCase().includes(searchQ);
    return matchCat&&matchSearch;
  });
  renderTable(filtered);
}

function setTabFilter(cat,el){
  activeFilter=cat;activeSidebar=cat;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');
  document.querySelectorAll('.sidebar-item').forEach(i=>i.classList.remove('active'));
  if(!cat) document.querySelector('.sidebar-item').classList.add('active');
  document.getElementById('content-title').textContent=cat||'Semua Dokumen';
  applyFilters();
}

function setSidebarFilter(cat,el){
  activeSidebar=cat;activeFilter=cat;
  document.querySelectorAll('.sidebar-item').forEach(i=>i.classList.remove('active'));el.classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('content-title').textContent=cat||'Semua Dokumen';
  applyFilters();
}

function setCacheBadge(fromCache,time){
  const b=document.getElementById('cacheBadge');
  if(fromCache){const m=Math.floor((Date.now()-time)/60000);b.textContent=`✓ Cache ${m<1?'baru':m+' minit lepas'}`;b.className='cache-badge fresh';}
  else{b.textContent='↻ Data terkini dari Sheets';b.className='cache-badge fresh';}
}

async function loadData(forceNetwork=false){
  if(!forceNetwork){
    try{
      const cached=localStorage.getItem(CACHE_KEY);
      const cachedTime=parseInt(localStorage.getItem(CACHE_TIME_KEY)||'0');
      if(cached&&(Date.now()-cachedTime)<CACHE_DURATION){
        allDocs=JSON.parse(cached);buildSidebar(allDocs);applyFilters();setCacheBadge(true,cachedTime);
        fetchFromNetwork(true);return;
      }
    }catch(e){}
  }
  await fetchFromNetwork(false);
}

async function fetchFromNetwork(silent=false){
  try{
    const res=await fetch(SHEET_URL+'&t='+Date.now());
    if(!res.ok) throw new Error();
    const text=await res.text();
    const docs=parseCSV(text);
    try{localStorage.setItem(CACHE_KEY,JSON.stringify(docs));localStorage.setItem(CACHE_TIME_KEY,Date.now().toString());}catch(e){}
    allDocs=docs;buildSidebar(allDocs);applyFilters();setCacheBadge(false);
  }catch(e){
    if(!silent){
      document.getElementById('tableWrap').innerHTML=`<div class="state-box"><div style="font-size:36px;">⚠️</div><div class="state-title">Gagal memuatkan data</div><div class="state-sub">Pastikan Google Sheets dah di-publish.<br>Klik "Refresh" untuk cuba lagi.</div></div>`;
      document.getElementById('content-count').textContent='Ralat';
    }
  }
}

function forceRefresh(){
  try{localStorage.removeItem(CACHE_KEY);localStorage.removeItem(CACHE_TIME_KEY);}catch(e){}
  document.getElementById('cacheBadge').textContent='Memuatkan...';
  loadData(true);
}

loadData();
</script>
</body>
</html>
